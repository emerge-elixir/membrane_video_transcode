name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.17.3'
            otp: '27.3'
            rust: '1.91.0'
          - elixir: '1.18.4'
            otp: '28.1.1'
            rust: stable
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev \
            libavcodec-dev libavformat-dev libavutil-dev libavdevice-dev \
            libavfilter-dev libswresample-dev libswscale-dev
      - name: Fetch dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: Check formatting
        run: |
          mix format --check-formatted
          cargo fmt --manifest-path native/video_decoder/Cargo.toml --all -- --check
      - name: Elixir checks
        run: |
          mix compile --warnings-as-errors
          mix test
          mix docs --warnings-as-errors
      - name: Rust checks (upstream FFmpeg)
        # The rpi feature needs patched target headers; see docs/releasing.md.
        run: |
          cargo test --manifest-path native/video_decoder/Cargo.toml --locked
          cargo clippy --manifest-path native/video_decoder/Cargo.toml --locked --all-targets -- -D warnings
          cargo build --manifest-path native/video_decoder/Cargo.toml --locked --release
      - name: Validate Hex package in a clean consumer
        run: bash scripts/check_package.sh
